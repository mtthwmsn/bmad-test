version: '3.8'

services:
  # PHP-FPM Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pourtest-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - pourtest-network
    depends_on:
      - db

  # Nginx Service
  webserver:
    image: nginx:alpine
    container_name: pourtest-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - pourtest-network
    depends_on:
      - app

  # MariaDB Service
  db:
    image: mariadb:latest
    container_name: pourtest-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pourtest
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: pourtest_user
      MYSQL_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - pourtest-network

  # PHPMyAdmin (optional, for database management)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pourtest-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    networks:
      - pourtest-network
    depends_on:
      - db

networks:
  pourtest-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
